name: Publicar la documentación

on:
  push:
    branches: [main]
  pull_request:
  # Trae las novedades de la última versión publicada aunque nadie toque la documentación
  schedule:
    - cron: "37 */6 * * *"
  repository_dispatch:
    types: [nueva-version]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Novedades y sitio
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    name: Publicar en GitHub Pages
    if: github.event_name != 'pull_request'
    needs: construir
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
